services:
  # --- 🚀 玄関 (Go) ---
  gateway:
    build: 
      context: ./gateway
      dockerfile: Dockerfile
    container_name: fortress-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./gateway:/app
    command: go run main.go 
    depends_on:
      - policy-engine
      - rust-backend
    networks:
      - fortress-net

  # --- ⚖️ 審判所 (Haskell) ---
  policy-engine:
    build:
      context: ./policy-server
      dockerfile: Dockerfile 
    container_name: fortress-policy
    expose:
      - "8000"
    networks:
      - fortress-net

  # --- 🛡️ 金庫 (Rust) ---
  rust-backend:
    build: ./backend
    container_name: fortress-backend
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
    expose:
      - "5000"
    env_file:
      - .env
    networks:
      - fortress-net

  # --- 🎨 管制塔 (React/TypeScript) 【補正：追加】 ---
  frontend:
    build: ./frontend
    container_name: fortress-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - gateway
    networks:
      - fortress-net

networks:
  fortress-net:
    driver: bridge

volumes:
  cargo-cache:



